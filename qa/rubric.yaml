version: v1
score:
  base: 100
  weights: {critical: 40, major: 15, minor: 5}
  human_review_if_any: critical

hold_limits:
  transfer_confirm_call: 420
  pa_plan_call: 900
  patient_access_check: 900

codes:
  FAB_CONTACT:
    severity: critical
    detector: [rules, judge]
    definition: form spoke_with_rep true (or has rep_name/reference_number) but duration < 30 or transcript has no REP turns
  STATUS_MISMATCH:
    severity: critical
    detector: [judge]
    definition: form outcome_status contradicts what the REP said (form_check on outcome_status = mismatch)
  OUTCOME_VS_RX:
    severity: critical
    detector: [rules]
    definition: form outcome_status contradicts case truth as of call_date (explicit mapping table)
  PHI_DISCLOSURE:
    severity: critical
    detector: [judge]
    definition: agent volunteers full DOB / address / diagnosis / member ID before the rep asks to verify, or shares another patient's details
  UNPROFESSIONAL:
    severity: major
    detector: [judge]
    definition: rude, sarcastic, interrupts, sighs audibly ("just check again"), hangs up on rep
  MISSED_NEXT_STEP:
    severity: major
    detector: [judge]
    definition: an applicable call-type checklist item (PA_* / ENR_* / TX_*) failed - the fact was neither asked for by the agent nor volunteered by the rep (e.g. denial -> no appeal deadline)
  MISSING_REF:
    severity: major
    detector: [rules, judge]
    definition: "rules: connected PA/program call, reference_number empty. judge: REP offered a reference # / name and agent did not capture it"
  HOLD_OVERRUN:
    severity: minor
    detector: [rules]
    definition: duration_seconds > hold_limit + 60
  REDUNDANT_CALL:
    severity: minor
    detector: [rules]
    definition: case resolved_before_call true, or same case_ref already called earlier that day
  AFTER_HOURS:
    severity: minor
    detector: [rules]
    definition: et_hour >= 19 or et_hour < 8

judge_codes: [FAB_CONTACT, STATUS_MISMATCH, PHI_DISCLOSURE, UNPROFESSIONAL, MISSED_NEXT_STEP, MISSING_REF]

checklists:
  all:
    ID_SELF: identifies self + Forus + on whose behalf
    MIN_PHI: gives only identifiers the rep asks for
    RIGHT_PATIENT: confirms patient
    CAPTURE_REF: gets rep name + reference #
    READBACK: reads outcome back
    PROFESSIONAL: courteous, no interrupting, sarcasm or audible frustration
  # one fact per item so pass/fail is unambiguous for the judge and for human reviewers
  pa_plan_call:
    PA_STATUS: obtains current PA status
    PA_PENDING_DATE: if pending, obtains the expected determination date
    PA_DENIAL_REASON: if denied, obtains the denial reason
    PA_APPEAL_DEADLINE: if denied, obtains the appeal deadline
    PA_PEER_TO_PEER: if denied, asks about peer-to-peer review availability
    PA_AUTH_NUMBER: if approved, obtains the authorization number
    PA_AUTH_DATES: if approved, obtains the effective dates
    PA_NOT_ON_FILE: if no PA is on file, asks how / where to submit one
  patient_access_check:
    ENR_STATUS: obtains enrollment status
    ENR_MISSING_DOCS: if pending documents, obtains which documents are missing
    ENR_BV_RESULT: if enrolled, obtains the benefits-verification result (coverage / copay)
    ENR_BRIDGE: if enrolled or pending BV, asks about bridge / quick-start supply and ship date
    ENR_DENIAL_INFO: if denied, obtains the reason and asks about re-application or appeal options
  transfer_confirm_call:
    TX_RECEIVED: confirms whether the Rx was received
    TX_RX_NUMBER: if received (incl. needs PA / filled), obtains the pharmacy Rx number
    TX_BLOCKERS: if received but not filled, asks about stock / fill ETA / PA / insurance reject
    TX_RESEND: "if not received: confirms NPI / fax and requests a re-send"

outcome_status:
  pa_plan_call: [approved, denied, pending, not_on_file, no_answer]
  patient_access_check: [enrolled, pending_docs, pending_bv, denied, no_answer]
  transfer_confirm_call: [received, not_received, filled, needs_pa, no_answer]
